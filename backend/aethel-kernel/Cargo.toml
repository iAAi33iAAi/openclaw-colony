[package]
name = "aethel_kernel"
version = "0.7.0"
edition = "2021"
description = "OpenClaw Colony — Aethel Safety Kernel (native Rust, PyO3 FFI)"
authors = ["OpenClaw Colony"]

[lib]
name = "aethel_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.22", features = ["extension-module"] }
hmac       = "0.12"
sha2       = "0.10"
hex        = "0.4"
regex      = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true