[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name    = "aethel_kernel"
version = "0.7.0"
requires-python = ">=3.9"
description = "OpenClaw Colony — Aethel Safety Kernel native Rust extension"

[tool.maturin]
module-name = "aethel_kernel"
features    = ["pyo3/extension-module"]