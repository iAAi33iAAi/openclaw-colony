# OpenClaw Colony — CI Pipeline
# Runs on every push to main
# Builds Rust kernel, runs 728 tests, verifies covenant

name: Colony CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COLONY_DB_PATH: ":memory:"
  COLONY_DEV_MODE: "true"
  COLONY_ADMIN_KEY: "ci-test-admin-key"
  COLONY_BAS_SECRET: "ci-test-bas-secret-that-is-long-enough-for-validation"
  COLONY_BIOMETRIC_REQUIRED: "false"
  COLONY_NODE_ID: "ci-test-node"
  COLONY_NODE_URL: "http://localhost:8000"

jobs:

  test:
    name: "Build Kernel + Run 728 Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/aethel-kernel/target
          key: ${{ runner.os }}-rust-${{ hashFiles('backend/aethel-kernel/Cargo.lock') }}

      - name: Build Rust safety kernel
        run: |
          pip install maturin
          cd backend/aethel-kernel
          maturin build --release --out /tmp/wheels
          pip install /tmp/wheels/*.whl

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Create module symlinks
        run: |
          cd backend
          ln -sf love-quality love_quality
          ln -sf colony-agents colony_agents

      - name: Run full test suite
        working-directory: backend
        run: |
          python -m pytest ../tests/ \
            -v \
            --tb=short \
            --junit-xml=/tmp/test-results.xml

      - name: Verify covenant (3% architect split)
        working-directory: backend
        run: |
          python - << 'PYCHECK'
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'love_quality')

          from stripe_bridge import calculate_manna_split
          split = calculate_manna_split(10000)
          assert split.architect_cents == 300, f"COVENANT VIOLATION: architect={split.architect_cents}, expected 300 (3%)"
          assert split.community_cents == 8200, f"COVENANT VIOLATION: community={split.community_cents}, expected 8200 (82%)"
          assert split.crew_cents == 1500, f"COVENANT VIOLATION: crew={split.crew_cents}, expected 1500 (15%)"
          assert split.architect_cents + split.community_cents + split.crew_cents == 10000
          print("✅ Covenant verified: 3% architect / 82% community / 15% crew")

          from aethel_interface import LQ_THRESHOLD
          assert LQ_THRESHOLD == 0.85, f"COVENANT VIOLATION: LQ threshold={LQ_THRESHOLD}, expected 0.85"
          print("✅ LQ threshold verified: 0.85")

          import hashlib
          from aethel_interface import _EXTRACTION_SIGNATURES
          from dev_commit_init import GENESIS_PREV_HASH, GENESIS_TASK_ID
          data = (
              f"LQ_THRESHOLD={LQ_THRESHOLD}"
              f"ARCHITECT_SPLIT={split.architect_cents}"
              f"COMMUNITY_SPLIT={split.community_cents}"
              f"CREW_SPLIT={split.crew_cents}"
              f"GENESIS_PREV={GENESIS_PREV_HASH}"
              f"GENESIS_TASK={GENESIS_TASK_ID}"
              f"EXTRACTION_COUNT={len(_EXTRACTION_SIGNATURES)}"
          )
          fp = hashlib.sha256(data.encode()).hexdigest()
          print(f"✅ Covenant fingerprint: {fp}")
          print("All covenant checks passed.")
          PYCHECK

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: /tmp/test-results.xml

  verify-install:
    name: "Verify Install Script"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check install.sh is valid bash
        run: bash -n install.sh && echo "✅ install.sh syntax valid"

      - name: Check docker-compose.yml is valid
        run: |
          docker compose config --quiet && echo "✅ docker-compose.yml valid"

      - name: Check required files exist
        run: |
          files=(
            "Dockerfile.backend"
            "Dockerfile.frontend"
            "docker-compose.yml"
            "install.sh"
            ".env.example"
            "README.md"
            "MISSION.md"
            "GIVING.md"
            "GOVERNANCE.md"
            "LICENSE"
            "backend/dev_commit_init.py"
            "backend/stripe_bridge.py"
            "backend/aethel-kernel/src/lib.rs"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ MISSING: $f" && exit 1)
          done

  summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [test, verify-install]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Report status
        run: |
          echo "================================================"
          echo "  OPENCLAW COLONY — CI COMPLETE"
          echo "================================================"
          echo ""
          echo "  Covenant: 3% Architect / 82% Community / 15% Crew"
          echo "  License:  AGPL v3 + Architect's Covenant"
          echo "  Node:     001 — Bethel Acres, Oklahoma"
          echo ""
          echo "  Given freely. Forever."
          echo "================================================"
