# OpenClaw Colony — Real-Time Roadmap Engine CI
# Implements the Execution Matrix:
# [ VECTORS ] → [ SPECS ] → [ DEV ] → [ TELEMETRY ]
#
# Every merge to main:
#   1. Verifies all three vectors hold
#   2. Builds Rust kernel from source
#   3. Runs full test suite (705+)
#   4. Validates install path in clean environment
#   5. Checks spec drift (API vs routes)
#   6. Reports telemetry baseline

name: Colony CI — Execution Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COLONY_DB_PATH: ":memory:"
  COLONY_DEV_MODE: "true"
  COLONY_ADMIN_KEY: "ci-test-admin-key"
  COLONY_BAS_SECRET: "ci-test-bas-secret-that-is-long-enough-for-validation"
  COLONY_BIOMETRIC_REQUIRED: "false"
  COLONY_NODE_ID: "ci-test-node"
  COLONY_NODE_URL: "http://localhost:8000"

jobs:

  # ── Vector Check: Safety ──────────────────────────────────────
  vector-safety:
    name: "Vector: Safety — Betrayal Impossible"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/aethel-kernel/target
          key: ${{ runner.os }}-rust-${{ hashFiles('backend/aethel-kernel/Cargo.lock') }}

      - name: Build Rust safety kernel
        run: |
          pip install maturin
          cd backend/aethel-kernel
          maturin build --release --out /tmp/wheels
          pip install /tmp/wheels/*.whl

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run safety-critical tests
        working-directory: backend
        run: |
          python -m pytest ../tests/test_aethel_kernel_rust.py \
                           ../tests/test_biometric.py \
                           ../tests/test_state_machine.py \
                           ../tests/test_colony_chaos.py \
                           -v --tb=short \
                           -m "not slow" \
                           --junit-xml=/tmp/safety-results.xml

      - name: Verify invariants hold
        working-directory: backend
        run: |
          python - << 'PYCHECK'
          import sys
          sys.path.insert(0, '.')

          # INV-001: Gate pipeline is sequential
          from aethel_interface import AethelInterface
          print("✓ INV-001: AethelInterface gate pipeline present")

          # INV-003: State machine transitions are enforced
          from state_machine import NodeState, _NODE_TRANSITIONS
          assert NodeState.STANDALONE not in _NODE_TRANSITIONS.get(NodeState.LIVE, set())
          print("✓ INV-003: Invalid state transitions rejected")

          # INV-005: SYNCING→LIVE requires lineage head check
          from state_machine import NodeStateMachine
          sm = NodeStateMachine("test", ["http://peer"])
          sm.transition(NodeState.SYNCING, "test")
          sm.update_peer_tip(100)
          sm.update_our_tip(50)
          result = sm.transition(NodeState.LIVE, "should fail")
          assert result is False, "CRITICAL: Lineage head check bypassed!"
          print("✓ INV-005: SYNCING→LIVE lineage head check enforced")

          print("\n✅ All safety invariants hold.")
          PYCHECK

      - name: Upload safety test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-test-results
          path: /tmp/safety-results.xml

  # ── Vector Check: Access ──────────────────────────────────────
  vector-access:
    name: "Vector: Access — One Command, Any Human"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify install.sh is executable and valid bash
        run: |
          test -x install.sh || (echo "FAIL: install.sh not executable" && exit 1)
          bash -n install.sh || (echo "FAIL: install.sh has syntax errors" && exit 1)
          echo "✓ install.sh is valid and executable"

      - name: Verify docker-compose.yml is valid
        run: |
          docker compose config --quiet
          echo "✓ docker-compose.yml is valid"

      - name: Verify Dockerfiles exist and are valid
        run: |
          test -f Dockerfile.backend || (echo "FAIL: Dockerfile.backend missing" && exit 1)
          test -f Dockerfile.frontend || (echo "FAIL: Dockerfile.frontend missing" && exit 1)
          echo "✓ Dockerfiles present"

      - name: Verify .env.example has all required keys
        run: |
          required_keys=(
            "COLONY_NODE_ID"
            "COLONY_NODE_URL"
            "COLONY_BAS_SECRET"
            "COLONY_ADMIN_KEY"
            "COLONY_BIOMETRIC_REQUIRED"
          )
          for key in "${required_keys[@]}"; do
            grep -q "^$key" .env.example || \
              (echo "FAIL: $key missing from .env.example" && exit 1)
            echo "✓ $key present in .env.example"
          done

      - name: Verify MISSION.md and GIVING.md exist
        run: |
          test -f MISSION.md || (echo "FAIL: MISSION.md missing" && exit 1)
          test -f GIVING.md  || (echo "FAIL: GIVING.md missing" && exit 1)
          echo "✓ Mission documents present"

      - name: Access vector summary
        run: |
          echo "✅ Access vector: One command, any human — VERIFIED"

  # ── Vector Check: Sovereignty ─────────────────────────────────
  vector-sovereignty:
    name: "Vector: Sovereignty — No External Choke Points"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for unauthorized external dependencies
        run: |
          # These SaaS dependencies require explicit ADR approval
          FORBIDDEN_DEPS=("firebase" "supabase" "auth0" "okta" "twilio")
          for dep in "${FORBIDDEN_DEPS[@]}"; do
            if grep -r "$dep" backend/ --include="*.py" -l 2>/dev/null; then
              echo "FAIL: Unauthorized external dependency: $dep"
              echo "Create an ADR in docs/adr/ before adding this dependency"
              exit 1
            fi
          done
          echo "✓ No unauthorized external dependencies"

      - name: Verify federation requires no central registry
        run: |
          # Federation must work with only COLONY_PEERS env var
          grep -q "COLONY_PEERS" backend/federation.py || \
            (echo "FAIL: Federation peer discovery broken" && exit 1)
          echo "✓ Federation uses peer-to-peer discovery"

      - name: Verify data is portable (SQLite)
        run: |
          grep -q "sqlite" backend/db.py || \
            (echo "FAIL: Non-portable database detected" && exit 1)
          echo "✓ Data stored in portable SQLite"

      - name: Sovereignty vector summary
        run: |
          echo "✅ Sovereignty vector: No external choke points — VERIFIED"

  # ── Full Test Suite ───────────────────────────────────────────
  test-suite:
    name: "Dev: Full Test Suite (705+)"
    runs-on: ubuntu-latest
    needs: [vector-safety, vector-access, vector-sovereignty]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/aethel-kernel/target
          key: ${{ runner.os }}-rust-${{ hashFiles('backend/aethel-kernel/Cargo.lock') }}

      - name: Build Rust kernel
        run: |
          pip install maturin
          cd backend/aethel-kernel
          maturin build --release --out /tmp/wheels
          pip install /tmp/wheels/*.whl

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run full test suite
        working-directory: backend
        run: |
          python -m pytest ../tests/ \
            -v \
            --tb=short \
            --junit-xml=/tmp/full-results.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Verify test count meets minimum
        working-directory: backend
        run: |
          COUNT=$(python -m pytest ../tests/ --collect-only -q 2>/dev/null | \
                  grep "test session starts" -A 9999 | \
                  grep -E "^[0-9]+ test" | \
                  grep -oE "^[0-9]+")
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 700 ]; then
            echo "FAIL: Test count $COUNT below minimum 700"
            echo "The test suite must grow, not shrink."
            exit 1
          fi
          echo "✓ Test count $COUNT meets minimum"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-results
          path: /tmp/full-results.xml

  # ── Spec Drift Check ──────────────────────────────────────────
  spec-drift:
    name: "Specs: No Drift Between Docs and Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ADRs exist for all major components
        run: |
          required_adrs=(
            "docs/adr/ADR-0001-rust-pyo3-kernel.md"
            "docs/adr/ADR-0002-sqlite-local-chain.md"
            "docs/adr/ADR-0003-lineage-in-rust.md"
            "docs/adr/ADR-0004-state-machine.md"
            "docs/adr/ADR-0005-one-command-installer.md"
          )
          for adr in "${required_adrs[@]}"; do
            test -f "$adr" || (echo "FAIL: Missing ADR: $adr" && exit 1)
            echo "✓ $adr present"
          done

      - name: Verify ROADMAP.md is present and has all slices
        run: |
          test -f docs/ROADMAP.md || (echo "FAIL: ROADMAP.md missing" && exit 1)
          grep -q "Slice 1" docs/ROADMAP.md || \
            (echo "FAIL: ROADMAP.md missing Slice 1" && exit 1)
          echo "✓ ROADMAP.md present with slices"

      - name: Verify protocol spec is present
        run: |
          test -f docs/specs/PROTOCOL_SPEC.md || \
            (echo "FAIL: PROTOCOL_SPEC.md missing" && exit 1)
          echo "✓ Protocol spec present"

      - name: Spec drift summary
        run: echo "✅ Spec drift check: All documents present — VERIFIED"

  # ── Telemetry Baseline ────────────────────────────────────────
  telemetry-baseline:
    name: "Telemetry: Baseline Metrics"
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - uses: actions/checkout@v4

      - name: Report repository metrics
        run: |
          echo "═══════════════════════════════════════════"
          echo "  OPENCLAW COLONY — CI TELEMETRY BASELINE"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "  Commit:     $(git rev-parse --short HEAD)"
          echo "  Branch:     $(git branch --show-current)"
          echo "  Files:      $(git ls-files | wc -l)"
          echo "  Lines:      $(git ls-files | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')"
          echo "  Test files: $(ls tests/test_*.py | wc -l)"
          echo "  ADRs:       $(ls docs/adr/*.md 2>/dev/null | wc -l)"
          echo ""
          echo "  Vectors:"
          echo "    Safety:      ✅ Betrayal Impossible"
          echo "    Access:      ✅ One Command, Any Human"
          echo "    Sovereignty: ✅ No External Choke Points"
          echo ""
          echo "  Slices:"
          echo "    Slice 1: First Node Online        [READY TO DEPLOY]"
          echo "    Slice 2: Betrayal-Proof Decision  [CODE COMPLETE]"
          echo "    Slice 3: Two Nodes, Federation    [CODE COMPLETE]"
          echo "    Slice 4: Node 001 Physical        [PLANNED]"
          echo "    Slice 5: v1.0.0 Genesis           [THE DESTINATION]"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  Node 001 — Bethel Acres"
          echo "  Given freely. Forever."
          echo "═══════════════════════════════════════════"
