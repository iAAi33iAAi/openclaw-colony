# OpenClaw Colony — Production Docker Compose
# One command: docker compose up -d
# Everything runs. No configuration required beyond .env

version: "3.9"

services:

  # ── Backend: Aethel Safety Kernel + FastAPI ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: colony-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - COLONY_DB_PATH=/data/colony.db
    volumes:
      - colony-data:/data
      - colony-logs:/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["sh", "-c", "python dev_commit_init.py && uvicorn colony-agents.orchestrator.colony_coordinator_v2:app --host 0.0.0.0 --port 8000 --workers 1 --log-level info"]

  # ── Frontend: React Dashboard ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: colony-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  colony-data:
    driver: local
  colony-logs:
    driver: local

networks:
  default:
    name: colony-network
